# User configuration for vbox-relocate (sourced as shell code).
#
# Location (first match wins):
#   ~/.config/<ORGANIZATION>/vbox-relocate.conf  (ORGANIZATION from /etc/org.conf)
#   ~/.config/orgdefault/vbox-relocate.conf
#   ~/.config/vbox-relocate.conf
#
# Precedence: built-in default < this file < environment variable < CLI.
# Remove the leading "#" to activate a setting.

# Default target parent directory.
#TARGET="/srv/vms"

# auto, offline, reflink, copy
#STRATEGY="auto"

# auto, require, off (RAM mode is planned, see docs/SPEC.md)
#RAM_MODE="auto"
#RAM_RESERVE=1024

# size, checksum
#VERIFY="size"

# 1: rename the source folder instead of deleting it
#KEEP_SOURCE=0

# auto, gui, headless, separate
#START_TYPE="auto"

# Journals and locks
#STATE_DIR="${HOME}/.local/state/vbox-relocate"
